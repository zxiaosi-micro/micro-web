packages:
  - "apps/*"
  - "apps-miniapp/*"
  - "apps-mobile/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
overrides:

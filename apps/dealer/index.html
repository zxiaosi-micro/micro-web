<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#042e2a" />
    <meta name="description" content="电池全生命周期管理平台 · 经销商端" />
    <title>经销商 Web · 电池全生命周期平台</title>
    <script>
      // FOUC 防护：React 挂载前按持久化偏好设 html 属性（prefs 模块 key 同源）
      (function () {
        try {
          if (localStorage.getItem("micro.theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
          }
          if (localStorage.getItem("micro.locale") === "en-US") {
            document.documentElement.lang = "en";
          }
        } catch (e) { /* storage 不可用时保持亮色中文 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
